
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLUS TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial}
header{background:#111b2c;padding:20px;font-size:25px;font-weight:bold}
header span{color:#42baff}
.container{padding:16px}
.hero{background:linear-gradient(135deg,#123e70,#111b2c);padding:25px;border-radius:18px}
.hero h1{font-size:27px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #34445b;background:#18243a;color:white;margin:15px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button{background:#087fca;color:white;border:0;padding:12px 16px;border-radius:9px;font-weight:bold}
button:disabled{background:#465266;color:#bbb}
.player{background:#111b2c;padding:12px;border-radius:14px;margin:20px 0}
video{width:100%;height:240px;border:0;background:#000;border-radius:10px}
.channels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.channel{background:#172238;padding:16px;border-radius:13px;text-align:center}
.channel h3{margin:10px 0}
footer{text-align:center;padding:25px;color:#8295ad}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<header>PLUS <span>TV</span></header>
<div class="container">
<div class="hero">
<h1>PLUS TV-yə xoş gəlmisiniz!</h1>
<p>Azərbaycan, Türkiyə və Rusiya kanalları bir platformada.</p>
</div>

<h2>Canlı televiziya</h2>
<div class="player">
<h3 id="playing">Kanal seçin</h3>
<video id="screen" controls playsinline autoplay
style="width:100%;height:240px;background:black;">
</video>
<iframe id="channelFrame" style="width:100%;height:240px;border:0;display:none;" allowfullscreen></iframe>
<p id="status">İzləmək istədiyiniz kanalı seçin.</p>
</div>

<input id="search" placeholder="Kanal axtar..." oninput="showChannels()">

<div class="filters">
<button onclick="filter('Hamısı')">Hamısı</button>
<button onclick="filter('Azərbaycan')">Azərbaycan</button>
<button onclick="filter('Türkiyə')">Türkiyə</button>
<button onclick="filter('Rusiya')">Rusiya</button>
</div>

<div class="channels" id="channels"></div>
</div>

<footer>PLUS TV © 2026<br>Online Television Platform</footer>

<script>
const data = [
{name:"AzTV",country:"Azərbaycan",url:""},
{name:"İTV",country:"Azərbaycan",url:"https://live.itv.az/itv.m3u8"}, 
{name:"CBC Sport",country:"Azərbaycan",url:""},
{name:"ATV",country:"Azərbaycan",url:"https://lives.atv.az:5443/ATV_TV_STREAM/streams/atvcanli.m3u8"},
{name:"Space TV",country:"Azərbaycan",url:""},
{name:"Xəzər TV",country:"Azərbaycan",url:""},
{name:"ARB",country:"Azərbaycan",url:""},
{name:"Mədəniyyət TV",country:"Azərbaycan",url:""},
{name:"TRT 1",country:"Türkiyə",url:"https://tv-trt1.medya.trt.com.tr/master.m3u8"},
{name:"Star TV",country:"Türkiyə",url:"https://dogus.daioncdn.net/startv/startv_720p.m3u8?app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3&sid=8l4w3lst4co5"},
{name:"Kanal D",country:"Türkiyə",url:"",officialPage:"https://www.kanald.com.tr/canli-yayin"},
{name:"NOW TV",country:"Türkiyə",url:"https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8"},
{name:"Россия 1",country:"Rusiya",url:"https://live.smotrim.ru/vgtrk/0/russia1-hd/index.m3u8"},
{name:"РБК",country:"Rusiya",url:""},
{name:"Россия 24",country:"Rusiya",url:"https://streaming.televizor-24-tochka.ru/live/30.m3u8"}, 
{name:"Test TV",country:"Rusiya",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
];
let selected = "Hamısı";

function filter(country){
  selected = country;
  showChannels();
}
let hlsPlayer = null;


function play(channel){
  const video = document.getElementById("screen");
  const frame = document.getElementById("channelFrame");

  document.getElementById("playing").textContent = channel.name;

  if(hlsPlayer){
    hlsPlayer.destroy();
    hlsPlayer = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  frame.removeAttribute("src");
  frame.style.display = "none";
  video.style.display = "block";

  if(channel.embedUrl || channel.officialPage){
    video.style.display = "none";
    frame.style.display = "block";
    frame.src = channel.embedUrl || channel.officialPage;
    document.getElementById("status").textContent =
      "Kanal açılır...";
    return;
  }

  if(!channel.url){
    document.getElementById("status").textContent =
      "Canlı yayım ünvanı əlavə edilməyib.";
    return;
  }

  if(Hls.isSupported()){
    hlsPlayer = new Hls();
    hlsPlayer.loadSource(channel.url);
    hlsPlayer.attachMedia(video);

    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function(){
      video.play();
    });

    hlsPlayer.on(Hls.Events.ERROR, function(event, data){
      document.getElementById("status").textContent =
        "HLS xətası: " + data.type + " / " + data.details;
    });

  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = channel.url;
    video.play();
  }
}
function showChannels(){
  const q = document.getElementById("search").value.toLowerCase();
  const list = data.filter(c =>
    (selected === "Hamısı" || c.country === selected) &&
    c.name.toLowerCase().includes(q)
  );

  const area = document.getElementById("channels");
  area.innerHTML = "";

  list.forEach(c => {
    const div = document.createElement("div");
    div.className = "channel";

    const name = document.createElement("h3");
    name.textContent = c.name;

    const country = document.createElement("p");
    country.textContent = c.country;

    const btn = document.createElement("button");
    btn.textContent = "Canlı izlə";
    btn.onclick = () => play(c);

    div.appendChild(name);
    div.appendChild(country);
    div.appendChild(btn);
    area.appendChild(div);
  });
}

document.getElementById("search").addEventListener("input", showChannels);
showChannels();
</script>
</body>
</html>
